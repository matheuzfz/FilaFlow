name: FilaFlow CI/CD Pipeline

# Gatilhos de execução do Workflow
on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
  # Permite a execução manual através da aba Actions no GitHub UI
  workflow_dispatch:

# Permissões necessárias para leitura do código e autenticação AWS via OIDC/Secrets
permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Job: Detect Changes (dorny/paths-filter)
  # ============================================================================
  changes:
    name: 'Detect Folder Changes'
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'terraform/**'
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ============================================================================
  # 2. Job: Terraform Plan
  # ============================================================================
  terraform-plan:
    name: 'Terraform Plan'
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      # Step 1: Fazer checkout do código-fonte do repositório
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configurar o executável do Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      # Step 3: Autenticar na AWS usando os secrets configurados
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 4: Inicializar o backend remoto (S3) e carregar módulos/providers
      - name: Terraform Init
        run: terraform init

      # Step 5: Gerar o plano de execução e salvar no arquivo 'tfplan'
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Step 6: Fazer o upload do artefato contendo o plano de execução
      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  # ============================================================================
  # 3. Job: Terraform Apply
  # ============================================================================
  terraform-apply:
    name: 'Terraform Apply'
    needs: terraform-plan
    environment: aws-production-infra
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      # Step 1: Fazer checkout do código-fonte
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configurar o executável do Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      # Step 3: Baixar o artefato do plano gerado no Job anterior
      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      # Step 4: Autenticar na AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 5: Inicializar o Terraform
      - name: Terraform Init
        run: terraform init

      # Step 6: Aplicar as mudanças salvas no plano aprovado
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # ============================================================================
  # 4. Job: Build and Push Backend Image to Amazon ECR
  # ============================================================================
  build-and-push-backend:
    name: 'Build and Push Backend'
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout do código do repositório
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configurar as credenciais da AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3: Autenticação/Login no Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build, Tag e Push da imagem Docker do Backend para o ECR
      - name: Build, Tag, and Push Backend Image to ECR
        env:
          ECR_REPOSITORY: 274622205752.dkr.ecr.us-east-1.amazonaws.com/filaflow-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REPOSITORY:latest -t $ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker push $ECR_REPOSITORY:latest
          docker push $ECR_REPOSITORY:$IMAGE_TAG

  # ============================================================================
  # 5. Job: Build and Push Frontend Image to Amazon ECR
  # ============================================================================
  build-and-push-frontend:
    name: 'Build and Push Frontend'
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout do código do repositório
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configurar as credenciais da AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3: Autenticação/Login no Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build, Tag e Push da imagem Docker do Frontend para o ECR
      - name: Build, Tag, and Push Frontend Image to ECR
        env:
          ECR_REPOSITORY: 274622205752.dkr.ecr.us-east-1.amazonaws.com/filaflow-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REPOSITORY:latest -t $ECR_REPOSITORY:$IMAGE_TAG ./frontend
          docker push $ECR_REPOSITORY:latest
          docker push $ECR_REPOSITORY:$IMAGE_TAG
